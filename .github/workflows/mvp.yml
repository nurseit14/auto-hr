name: MVP checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-ml:
    name: Backend and ML regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTO_HR_ENABLE_ML1: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install tested backend and regression dependencies
        run: python -m pip install -r backend/requirements.lock 'pandas>=2,<3' 'openai==1.109.1'
      - name: Run offline tests
        run: python -m pytest -q backend/tests ML1/tests ML2/tests

  frontend:
    name: TypeScript and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript and build frontend
        run: npm run build
